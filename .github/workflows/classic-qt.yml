name: Classic Qt build and runtime evidence

# Compiles the real Qt source on a disposable Ubuntu runner and captures
# screenshots from the compiled executable. A green run is build/runtime
# evidence only: it is not owner visual approval, a desktop session test or
# Linux Mint acceptance.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canopy-classic-qt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qt 6.4+ build and headless runtime dependencies
        timeout-minutes: 18
        run: |
          sudo sed -i 's@http://us-east-2.ec2.archive.ubuntu.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            build-essential cmake ninja-build xvfb \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools libqt6svg6 libglib2.0-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtqml \
            qml6-module-qtqml-workerscript

      - name: Configure
        run: cmake -S prototype/classic -B build/classic -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        timeout-minutes: 6
        run: cmake --build build/classic --parallel 2

      - name: Stage exact SHA-verified v3 five-icon production pack
        # The compiled binary reads ./production-icons beside itself. Without
        # a staged pack it reports FIVE_PRODUCTION_PACK_FALLBACK, which is not
        # acceptance of the production pack. Export from the exact SHA-locked
        # eight masters with the registered canopy-five-qt-v3 renderer, verify
        # source/renderer/per-file SHA exactly, then prove a bounded normalized
        # RGB identity for both exports. Raw exported-manifest bytes are not
        # stable across software renderers, so they are recorded but not used
        # as the identity gate.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          rm -rf build/classic/production-icons test-artifacts/reproducible-five-icons
          QT_QPA_PLATFORM=offscreen ./build/classic/canopy-classic-spike \
            --approved-art-dir prototype/classic/assets/approved \
            --export-five-production-icons build/classic/production-icons
          QT_QPA_PLATFORM=offscreen ./build/classic/canopy-classic-spike \
            --approved-art-dir prototype/classic/assets/approved \
            --export-five-production-icons test-artifacts/reproducible-five-icons
          python3 tools/validate_five_production_icons.py \
            --approved-art-dir prototype/classic/assets/approved \
            --production-dir build/classic/production-icons \
            --report test-artifacts/five-production-pack-integrity.json
          python3 tools/validate_five_production_icons.py \
            --approved-art-dir prototype/classic/assets/approved \
            --production-dir test-artifacts/reproducible-five-icons \
            --report test-artifacts/five-production-pack-reproducible-integrity.json
          python3 tools/check_five_dock_centering.py \
            --approved-art-dir prototype/classic/assets/approved \
            --pack-dir build/classic/production-icons \
            --reproducible-dir test-artifacts/reproducible-five-icons \
            --output test-artifacts/five-production-pack-identity.json \
            | tee test-artifacts/five-production-pack-identity.txt
          grep -qx 'V3_PACK_NORMALIZED_IDENTITY_PASS: rounded RGB identity, bounded export noise' \
            test-artifacts/five-production-pack-identity.txt
          sha256sum build/classic/production-icons/manifest.json \
            | tee test-artifacts/five-production-pack-manifest-sha256.txt
          cp -a build/classic/production-icons test-artifacts/production-icons
          echo "CANOPY_V3_PRODUCTION_PACK_STAGED: 15 SHA-checked v3 PNGs, bounded normalized identity"

      - name: Verify real GIO launcher path and opt-in safety
        timeout-minutes: 3
        run: |
          set -e
          capability=$(xvfb-run -a ./build/classic/canopy-classic-spike --self-test-system-apps-capability)
          echo "$capability"
          echo "$capability" | grep -q 'CANOPY_GIO_ENABLED'
          xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --self-test-system-apps
          mkdir -p test-artifacts/gio-xdg/applications
          marker="$PWD/test-artifacts/gio-launch-marker"
          rm -f "$marker"
          printf '[Desktop Entry]\nType=Application\nName=Canopy GIO Fixture\nExec=/bin/sh -c "touch %s"\nNoDisplay=false\nTerminal=false\n' "$marker" > test-artifacts/gio-xdg/applications/nemo.desktop
          XDG_DATA_HOME="$PWD/test-artifacts/gio-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/gio-xdg:/usr/share/applications" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --self-test-system-apps-fixture
          test -f "$marker"

      - name: Verify Files dock reaches the real GIO launcher
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/gio-xdg/applications
          dock_marker="$PWD/test-artifacts/gio-dock-launch-marker"
          rm -f "$dock_marker"
          printf '[Desktop Entry]\nType=Application\nName=Canopy Files Dock Fixture\nExec=/bin/sh -c "touch %s"\nNoDisplay=false\nTerminal=false\n' "$dock_marker" > test-artifacts/gio-xdg/applications/nemo.desktop
          XDG_DATA_HOME="$PWD/test-artifacts/gio-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/gio-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --self-test-files-dock-fixture
          test -f "$dock_marker"

      - name: Verify Browser dock reaches the real GIO launcher
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/browser-gio-xdg/applications
          browser_marker="$PWD/test-artifacts/browser-dock-launch-marker"
          rm -f "$browser_marker"
          printf '[Desktop Entry]\nType=Application\nName=Canopy Browser Dock Fixture\nExec=/bin/sh -c "touch %s"\nNoDisplay=false\nTerminal=false\n' "$browser_marker" > test-artifacts/browser-gio-xdg/applications/firefox.desktop
          XDG_DATA_HOME="$PWD/test-artifacts/browser-gio-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/browser-gio-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --self-test-browser-dock-fixture
          test -f "$browser_marker"

      - name: Verify Browser dock refusal is visible without a browser
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/browser-status-xdg/applications
          XDG_DATA_HOME="$PWD/test-artifacts/browser-status-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/browser-status-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --self-test-browser-dock-status

      - name: Verify Mail dock reaches the real GIO launcher
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/mail-gio-xdg/applications
          mail_marker="$PWD/test-artifacts/mail-dock-launch-marker"
          rm -f "$mail_marker"
          printf '[Desktop Entry]\nType=Application\nName=Canopy Mail Dock Fixture\nExec=/bin/sh -c "touch %s"\nNoDisplay=false\nTerminal=false\n' "$mail_marker" > test-artifacts/mail-gio-xdg/applications/thunderbird.desktop
          XDG_DATA_HOME="$PWD/test-artifacts/mail-gio-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/mail-gio-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --approved-art-dir prototype/classic/assets/approved --self-test-mail-dock-fixture
          test -f "$mail_marker"

      - name: Verify Mail dock refusal is visible without a mail app
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/mail-status-xdg/applications
          XDG_DATA_HOME="$PWD/test-artifacts/mail-status-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/mail-status-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --approved-art-dir prototype/classic/assets/approved --self-test-mail-dock-status

      - name: Verify Calendar dock reaches the real GIO launcher
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/calendar-gio-xdg/applications
          marker="$PWD/test-artifacts/calendar-dock-launch-marker"
          rm -f "$marker"
          printf '[Desktop Entry]\nType=Application\nName=Canopy Calendar Dock Fixture\nExec=/bin/sh -c "touch %s"\nNoDisplay=false\nTerminal=false\n' "$marker" > test-artifacts/calendar-gio-xdg/applications/org.gnome.Calendar.desktop
          XDG_DATA_HOME="$PWD/test-artifacts/calendar-gio-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/calendar-gio-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --approved-art-dir prototype/classic/assets/approved --self-test-calendar-dock-fixture
          test -f "$marker"

      - name: Verify Calendar dock refusal is visible without the app
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/calendar-status-xdg/applications
          XDG_DATA_HOME="$PWD/test-artifacts/calendar-status-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/calendar-status-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --approved-art-dir prototype/classic/assets/approved --self-test-calendar-dock-status

      - name: Verify Photos dock reaches the real GIO launcher
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/photos-gio-xdg/applications
          marker="$PWD/test-artifacts/photos-dock-launch-marker"
          rm -f "$marker"
          printf '[Desktop Entry]\nType=Application\nName=Canopy Photos Dock Fixture\nExec=/bin/sh -c "touch %s"\nNoDisplay=false\nTerminal=false\n' "$marker" > test-artifacts/photos-gio-xdg/applications/org.gnome.Loupe.desktop
          XDG_DATA_HOME="$PWD/test-artifacts/photos-gio-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/photos-gio-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --approved-art-dir prototype/classic/assets/approved --self-test-photos-dock-fixture
          test -f "$marker"

      - name: Verify Photos dock refusal is visible without the app
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/photos-status-xdg/applications
          XDG_DATA_HOME="$PWD/test-artifacts/photos-status-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/photos-status-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --approved-art-dir prototype/classic/assets/approved --self-test-photos-dock-status

      - name: Verify Terminal dock reaches the real GIO launcher
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/terminal-gio-xdg/applications
          marker="$PWD/test-artifacts/terminal-dock-launch-marker"
          rm -f "$marker"
          printf '[Desktop Entry]\nType=Application\nName=Canopy Terminal Dock Fixture\nExec=/bin/sh -c "touch %s"\nNoDisplay=false\nTerminal=false\n' "$marker" > test-artifacts/terminal-gio-xdg/applications/gnome-terminal.desktop
          XDG_DATA_HOME="$PWD/test-artifacts/terminal-gio-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/terminal-gio-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --approved-art-dir prototype/classic/assets/approved --self-test-terminal-dock-fixture
          test -f "$marker"

      - name: Verify Terminal dock refusal is visible without the app
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p test-artifacts/terminal-status-xdg/applications
          XDG_DATA_HOME="$PWD/test-artifacts/terminal-status-xdg" XDG_DATA_DIRS="$PWD/test-artifacts/terminal-status-xdg" \
            xvfb-run -a ./build/classic/canopy-classic-spike --enable-system-apps --approved-art-dir prototype/classic/assets/approved --self-test-terminal-dock-status

      - name: Verify Classic dock launch source contracts
        run: python3 -m unittest tests.test_classic_browser_dock_integration tests.test_classic_mail_dock_integration tests.test_classic_remaining_dock_integration tests.test_classic_desktop_integration -v

      - name: Verify approved eight-icon artwork
        run: python3 -m unittest tests.test_approved_art tests.test_approved_manifest_contract tests.test_approved_art_zip -v

      - name: Require verified v3 production pack in the compiled runtime
        # tools.check_five_dock_centering.verify_pack_activation fails closed
        # on a fallback, a FAIL marker, a duplicate or a missing VERIFIED marker.
        # A fallback renderer is deliberately NOT accepted as pack evidence.
        timeout-minutes: 4
        env:
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          test -s build/classic/production-icons/manifest.json
          xvfb-run -a ./build/classic/canopy-classic-spike \
            --approved-art-dir prototype/classic/assets/approved \
            --require-five-production-icons \
            --self-test-approved --self-test-size 1200x750 \
            --self-test-screenshot test-artifacts/five-pack-runtime-1200x750.png \
            > test-artifacts/five-production-runtime.log 2>&1
          python3 tools/check_five_dock_centering.py \
            --pack-log test-artifacts/five-production-runtime.log \
            --output test-artifacts/five-production-activation.json \
            | tee test-artifacts/five-production-activation.txt
          grep -qx 'FIVE_PRODUCTION_PACK_VERIFIED=1' \
            test-artifacts/five-production-activation.txt
          if grep -q 'FIVE_PRODUCTION_PACK_FALLBACK\|FIVE_PRODUCTION_PACK_FAIL' \
             test-artifacts/five-production-runtime.log; then
            echo "FIVE_PRODUCTION_PACK_NOT_VERIFIED: fallback or failure in runtime log" >&2
            exit 1
          fi
          python3 tools/check_screenshot.py \
            test-artifacts/five-pack-runtime-1200x750.png 1200 750

      - name: Verify five-dock gates and CI pack contracts
        run: python3 -m unittest tests.test_five_dock_centering tests.test_five_production_pack_version_gate tests.test_classic_five_icon_runtime_mode -v

      - name: Headless startup smoke test
        timeout-minutes: 2
        env:
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 tools/qt_smoke.py build/classic/canopy-classic-spike

      - name: Capture three real screenshots from the compiled binary
        timeout-minutes: 4
        env:
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p test-artifacts
          timeout 40s xvfb-run -a ./build/classic/canopy-classic-spike --approved-art-dir prototype/classic/assets/approved --self-test-approved --self-test-size 1920x1080 --self-test-screenshot test-artifacts/classic-1920x1080.png
          python3 tools/check_screenshot.py test-artifacts/classic-1920x1080.png 1920 1080
          timeout 40s xvfb-run -a ./build/classic/canopy-classic-spike --approved-art-dir prototype/classic/assets/approved --self-test-approved --self-test-size 1200x750 --self-test-screenshot test-artifacts/classic-1200x750.png
          python3 tools/check_screenshot.py test-artifacts/classic-1200x750.png 1200 750
          timeout 40s xvfb-run -a ./build/classic/canopy-classic-spike --approved-art-dir prototype/classic/assets/approved --self-test-approved --self-test-size 760x500 --self-test-screenshot test-artifacts/classic-760x500.png
          python3 tools/check_screenshot.py test-artifacts/classic-760x500.png 760 500
          sha256sum test-artifacts/*.png > test-artifacts/screenshot-sha256.txt

      - name: Verify bounded frozen-icon identity with the staged v3 pack
        timeout-minutes: 4
        env:
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          size=1200x750
          xvfb-run -a ./build/classic/canopy-classic-spike \
            --approved-art-dir prototype/classic/assets/approved \
            --dock-five-center-review --require-five-production-icons \
            --self-test-approved --self-test-size "$size" \
            --self-test-screenshot "test-artifacts/dock-five-center-$size.png" \
            > "test-artifacts/dock-five-center-$size.log" 2>&1
          python3 tools/check_five_dock_centering.py \
            --pack-log "test-artifacts/dock-five-center-$size.log" \
            --output "test-artifacts/dock-five-center-activation-$size.json"
          python3 tools/check_screenshot.py \
            "test-artifacts/dock-five-center-$size.png" 1200 750
          # The ordinary startup already selects v3 five-center. Comparing it
          # with the explicit flag proves activation; frozen artwork and every
          # non-icon pixel stay locked (bounded compositing jitter excepted).
          python3 tools/check_five_dock_centering.py \
            --frozen-identity \
            --before "test-artifacts/classic-$size.png" \
            --after "test-artifacts/dock-five-center-$size.png" \
            --size "$size" \
            --output "test-artifacts/dock-five-center-identity-$size.json"

      - name: Sample SYNTHETIC CI-SCOPED idle CPU/PSS proxy under Xvfb (real 5-min PSS/GPU/wakeups NOT_RUN)
        timeout-minutes: 9
        env:
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 tools/measure_qt.py build/classic/canopy-classic-spike test-artifacts/qt-idle-300s.json --seconds 300

      - name: Upload compile and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canopy-classic-qt-evidence
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
