name: Classic Qt build and smoke test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt build and headless runtime dependencies
        timeout-minutes: 16
        run: |
          # GitHub's regional EC2 Ubuntu mirror has repeatedly stalled on large Qt packages.
          # Use Ubuntu's primary archive endpoint; preserve security and non-Ubuntu sources.
          sudo sed -i 's@http://us-east-2.ec2.archive.ubuntu.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            build-essential cmake ninja-build xvfb \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtqml \
            qml6-module-qtqml-workerscript
      - name: Configure
        run: cmake -S prototype/classic -B build/classic -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        timeout-minutes: 5
        run: cmake --build build/classic --parallel 2
      - name: Autonomous UI screenshot test
        timeout-minutes: 2
        env:
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p test-artifacts
          timeout 30s xvfb-run -a ./build/classic/canopy-classic-spike --self-test-size 1200x750 --self-test-screenshot test-artifacts/classic-standard.png
          python3 tools/check_screenshot.py test-artifacts/classic-standard.png 1200 750
          timeout 30s xvfb-run -a ./build/classic/canopy-classic-spike --self-test-size 1200x750 --self-test-launcher --self-test-screenshot test-artifacts/classic-launcher-standard.png
          python3 tools/check_screenshot.py test-artifacts/classic-launcher-standard.png 1200 750
          timeout 30s xvfb-run -a ./build/classic/canopy-classic-spike --self-test-size 760x500 --self-test-screenshot test-artifacts/classic-compact.png
          python3 tools/check_screenshot.py test-artifacts/classic-compact.png 760 500
          timeout 30s xvfb-run -a ./build/classic/canopy-classic-spike --self-test-size 760x500 --self-test-launcher --self-test-screenshot test-artifacts/classic-launcher-compact.png
          python3 tools/check_screenshot.py test-artifacts/classic-launcher-compact.png 760 500
          timeout 30s xvfb-run -a ./build/classic/canopy-classic-spike --self-test-size 1920x1080 --self-test-screenshot test-artifacts/classic-fullhd.png
          python3 tools/check_screenshot.py test-artifacts/classic-fullhd.png 1920 1080
      - name: Capture informational CPU and PSS baseline
        timeout-minutes: 2
        env:
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 tools/measure_qt.py build/classic/canopy-classic-spike test-artifacts/qt-resource-baseline.json --seconds 5
      - name: Upload UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canopy-classic-ui-evidence
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Headless QML smoke test
        env:
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 tools/qt_smoke.py build/classic/canopy-classic-spike
