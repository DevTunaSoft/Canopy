name: Canopy Windows VM status self-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vm-status:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise read-only VM identity parser
        shell: pwsh
        run: ./scripts/Get-CanopyVMStatus.ps1 -SelfTest
