<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<title>Canopy Terminal — original developer icon</title>
<desc>Original charcoal terminal window with ivory command prompt and subtle forest green and gold details.</desc>
<defs>
<linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#586b66"/><stop offset=".4" stop-color="#263734"/><stop offset="1" stop-color="#09191a"/></linearGradient>
<linearGradient id="screen" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#173f36"/><stop offset=".48" stop-color="#102c2a"/><stop offset="1" stop-color="#081b22"/></linearGradient>
<linearGradient id="cap" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#6b847d"/><stop offset="1" stop-color="#344843"/></linearGradient>
</defs>
<rect x="10" y="14" width="108" height="100" rx="20" fill="url(#frame)" stroke="#9ea99c" stroke-opacity=".7" stroke-width="2.5"/>
<rect x="17" y="21" width="94" height="86" rx="14" fill="url(#screen)" stroke="#d0d9b5" stroke-opacity=".3" stroke-width="1.5"/>
<path d="M17 36 Q17 21 32 21 H96 Q111 21 111 36 V40 H17Z" fill="url(#cap)"/>
<circle cx="29" cy="31" r="3" fill="#e49c80"/><circle cx="40" cy="31" r="3" fill="#dfc17c"/><circle cx="51" cy="31" r="3" fill="#9bc79f"/>
<path d="M37 52 L55 67 L37 82" fill="none" stroke="#f7f5eb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M65 83 H90" fill="none" stroke="#d8b87a" stroke-width="8" stroke-linecap="round"/>
<path d="M27 100 H100" fill="none" stroke="#5cae8c" stroke-opacity=".46" stroke-width="2"/>
</svg>
